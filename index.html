<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>遛崽 · 碰一下，让你的孩子先替你去认识人</title>
<meta name="description" content="走到另一个孩子身边，两个 AI 先聊六句，回来告诉你：这人值不值得深交。">
<meta name="theme-color" content="#0f1210">
<meta property="og:title" content="遛崽 · 碰一下，让你的孩子先替你去认识人">
<meta property="og:description" content="两个 AI 先聊六句，回来告诉你这人值不值得深交。">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#1a1a22;
    --paper:#f4f1e8;
    --accent:#f0c040;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0f1210;
    font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent}
  #stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
  canvas{display:block;image-rendering:pixelated;max-width:100%;max-height:100%;
    touch-action:none;cursor:default}

  /* 顶部提示 */
  .hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    background:rgba(20,22,20,.72);color:#e8e4d8;font-size:13px;
    padding:7px 16px;border-radius:20px;letter-spacing:.4px;
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);
    white-space:nowrap;pointer-events:none;transition:opacity .4s}
  .hud.hide{display:none}

  /* agent 连接状态 */
  .agent-badge{position:absolute;top:16px;right:16px;font-size:11.5px;
    padding:6px 13px;border-radius:20px;letter-spacing:.4px;
    border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);
    background:rgba(20,22,20,.7);color:#a8a6b8;pointer-events:none}
  .agent-badge.on{color:#8fd8c4;border-color:rgba(95,176,160,.5);
    background:rgba(30,59,54,.72)}
  .agent-badge.off{color:#a8a6b8}

  /* 对话气泡 */
  .bubble{position:absolute;left:50%;bottom:7%;transform:translateX(-50%) translateY(14px);
    width:min(560px,88vw);background:#f4f1e8;color:#222;
    border-radius:16px;padding:18px 20px 16px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    visibility:hidden;pointer-events:none;transition:transform .22s ease-out;
    border:2px solid #1a1a22}
  .bubble.show{visibility:visible;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .bubble .who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .bubble .who img{width:30px;height:30px;image-rendering:pixelated;
    border-radius:6px;background:#e8e2d0}
  .bubble .who b{font-size:13px;letter-spacing:.5px}
  .bubble .who span{font-size:11px;color:#8a8474;margin-left:auto}
  .bubble p{font-size:14px;line-height:1.85;color:#33302a}
  .bubble .opts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .bubble button{font-family:inherit;font-size:13px;padding:7px 15px;border-radius:20px;
    border:1.5px solid #1a1a22;background:transparent;color:#1a1a22;
    cursor:pointer;transition:background .15s,color .15s}
  .bubble button:hover{background:#1a1a22;color:#f4f1e8}
  .bubble button.primary{background:var(--accent);border-color:#1a1a22;font-weight:700}

  /* ---------- 汇报卡片 ---------- */
  .report{position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(12,14,12,.72);backdrop-filter:blur(4px);
    visibility:hidden;pointer-events:none;transition:transform .24s ease-out;
    transform:scale(.98);z-index:20}
  .report.show{visibility:visible;pointer-events:auto;transform:scale(1)}

  .card{width:min(600px,92vw);max-height:88vh;overflow-y:auto;
    background:#f4f1e8;color:#222;border:2px solid #1a1a22;border-radius:18px;
    box-shadow:0 26px 70px rgba(0,0,0,.55)}

  .card-head{display:flex;align-items:center;gap:14px;
    padding:20px 22px 16px;border-bottom:1.5px solid rgba(26,26,34,.14)}
  .card-head img{width:48px;height:48px;image-rendering:pixelated;
    border-radius:10px;background:#e6e0ce;border:1.5px solid rgba(26,26,34,.16)}
  .card-head .who{flex:1;line-height:1.5}
  .card-head .who b{display:block;font-size:14px;letter-spacing:.4px}
  .card-head .who span{font-size:11.5px;color:#8a8474}
  .score{text-align:right}
  .score b{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .score span{display:block;font-size:10.5px;color:#8a8474;letter-spacing:1px}

  .card-body{padding:18px 22px 6px;display:flex;flex-direction:column;gap:15px}
  .row-label{font-size:11px;letter-spacing:1.6px;color:#8a8474;
    text-transform:uppercase;margin-bottom:6px}
  .tags{display:flex;gap:7px;flex-wrap:wrap}
  .tag{font-size:12.5px;padding:4px 11px;border-radius:20px;
    background:rgba(240,192,64,.30);border:1px solid rgba(26,26,34,.22)}
  .tag.warn{background:rgba(200,110,90,.20);border-color:rgba(160,70,50,.30)}
  .quote{font-size:13.5px;line-height:1.75;color:#3a3630;padding:11px 14px;
    background:rgba(26,26,34,.055);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}

  .card-foot{padding:16px 22px 20px;display:flex;gap:10px}
  .card-foot button{flex:1;font-family:inherit;font-size:14px;font-weight:600;
    padding:12px 0;border-radius:12px;cursor:pointer;
    border:1.5px solid #1a1a22;background:transparent;color:#1a1a22;
    transition:background .15s,color .15s}
  .card-foot button:hover{background:#1a1a22;color:#f4f1e8}
  .card-foot button.primary{background:var(--accent);font-weight:700}
  .card-foot button.primary:hover{background:#1a1a22;color:var(--accent)}

  /* 首屏引导：一点就能看完整流程 */
  .intro{position:absolute;inset:0;display:grid;place-items:center;z-index:30;
    background:rgba(10,12,10,.78);backdrop-filter:blur(3px)}
  .intro.hide{display:none}
  .intro-card{width:min(520px,90vw);background:var(--paper);color:#222;
    border:3px solid var(--ink);padding:30px 30px 24px;
    box-shadow:10px 10px 0 rgba(0,0,0,.35)}
  .intro-tag{display:inline-block;background:var(--accent);color:#1a1a22;
    font-size:12px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;
    border:2px solid var(--ink);margin-bottom:14px}
  .intro-card h1{font-size:22px;line-height:1.5;letter-spacing:.5px;
    font-weight:800;margin-bottom:12px}
  .intro-card p{font-size:13px;line-height:1.8;color:#4a3e58;margin-bottom:20px}
  .intro-btns{display:flex;gap:10px;flex-wrap:wrap}
  .intro-btns button{font-family:inherit;font-size:13.5px;font-weight:700;
    padding:11px 18px;border:2px solid var(--ink);background:transparent;
    color:#222;cursor:pointer;transition:background .15s,color .15s}
  .intro-btns button:hover{background:#1a1a22;color:var(--paper)}
  .intro-btns button.primary{background:var(--accent)}
  .intro-btns button.primary:hover{background:#1a1a22;color:var(--accent)}
  .intro-foot{margin-top:14px;font-size:11.5px;color:#8a809a;letter-spacing:.3px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="640"></canvas>
  <div class="hud" id="hud">方向键 / WASD 走动 · 靠近另一个孩子就会开口</div>
  <div class="agent-badge off" id="agent-badge">检测 agent…</div>

  <!-- 首屏：点一下就知道该干什么 -->
  <div class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-tag">遛崽 · 可玩原型</div>
      <h1>碰一下，让你的孩子<br>替你先去认识别人家的孩子</h1>
      <p>你走到另一个孩子身边，两个 AI 先聊六句，然后回来告诉你：这人值不值得深交。</p>
      <div class="intro-btns">
        <button class="primary" id="btn-auto">一键看完整流程</button>
        <button id="btn-walk">我自己走</button>
      </div>
      <div class="intro-foot">键盘 WASD / 方向键；手机上按住屏幕往目标方向拖</div>
    </div>
  </div>
  <div class="bubble" id="bubble">
    <div class="who">
      <img id="bub-avatar" alt="">
      <b id="bub-name">另一个孩子</b>
      <span id="bub-tag">附近 · 3 米</span>
    </div>
    <p id="bub-text"></p>
    <div class="opts" id="bub-opts"></div>
  </div>

  <!-- 汇报卡片 -->
  <div class="report" id="report">
    <div class="card">
      <div class="card-head">
        <img id="rp-avatar" alt="">
        <div class="who">
          <b id="rp-name">阿紫</b>
          <span id="rp-desc">刚聊完 · 3 轮 · 附近 3 米</span>
        </div>
        <div class="score">
          <b id="rp-score">84</b>
          <span>合得来</span>
        </div>
      </div>
      <div class="card-body">
        <div>
          <div class="row-label">你们都在意</div>
          <div class="tags" id="rp-same"></div>
        </div>
        <div>
          <div class="row-label">可能要小心</div>
          <div class="tags" id="rp-risk"></div>
        </div>
        <div>
          <div class="row-label">可以这样开口</div>
          <div class="quote" id="rp-open"></div>
        </div>
      </div>
      <div class="card-foot">
        <button class="primary" id="rp-go">我自己去聊</button>
        <button id="rp-skip">算了</button>
      </div>
    </div>
  </div>
</div>

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width, H = canvas.height;
  const TILE = 40;
  const COLS = W / TILE, ROWS = H / TILE;

  /* ---------- 场景：一张手写的瓦片地图 ---------- */
  // 0 草 1 石板路 2 水 3 花坛 4 树
  const MAP = (() => {
    const m = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    // 横向主路
    for (let x = 2; x < COLS - 2; x++) { m[7][x] = 1; m[8][x] = 1; }
    // 纵向支路
    for (let y = 3; y < ROWS - 2; y++) { m[y][11] = 1; m[y][12] = 1; }
    // 小池塘
    for (const [x, y] of [[3,3],[4,3],[3,4],[4,4],[5,4],[4,5]]) m[y][x] = 2;
    // 花坛
    for (const [x, y] of [[17,3],[18,3],[17,4],[18,4]]) m[y][x] = 3;
    for (const [x, y] of [[6,11],[7,11],[6,12],[7,12]]) m[y][x] = 3;
    // 树
    for (const [x, y] of [[20,11],[20,12],[2,10],[15,5],[9,3]]) m[y][x] = 4;
    return m;
  })();

  const PALETTE = {
    grass: '#7aa86a', grassAlt: '#6f9c60',
    path:  '#c9b795', pathAlt: '#bfab88',
    water: '#5b93b8', waterAlt: '#5289ad',
    soil:  '#8a6b52',
    tree:  '#3f6b48', treeDark: '#355c3d', trunk: '#6b4f3a',
    flower: ['#e88ba0','#f0c040','#e8e4d8'],
  };

  /* ---------- 角色 ---------- */
  const hero = {
    x: 11 * TILE + 20, y: 9 * TILE + 20,
    speed: 2.6, dir: 1, bob: 0, img: new Image()
  };
  const npc = {
    x: 17 * TILE, y: 8 * TILE + 6,
    bob: 0, img: new Image()
  };
  hero.img.src = HERO_DATA;
  npc.img.src = NPC_DATA;

  const SPRITE = 64;          // 屏幕上的角色边长
  const TALK_RANGE = 82;      // 靠近多少像素触发对话

  /* ---------- 输入 ---------- */
  const keys = Object.create(null);
  const norm = (k) => {
    const m = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
               w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
    return m[k] || null;
  };
  addEventListener('keydown', (e) => {
    const d = norm(e.key);
    if (d) { keys[d] = true; e.preventDefault(); }
  });
  addEventListener('keyup', (e) => {
    const d = norm(e.key);
    if (d) { keys[d] = false; e.preventDefault(); }
  });

  // 触屏：按住哪儿往哪儿走
  let touch = null;
  let autoDemo = false;   // 一键演示：程序自己把孩子领过去
  const toCanvas = (ev) => {
    const r = canvas.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return {
      x: (t.clientX - r.left) * (W / r.width),
      y: (t.clientY - r.top) * (H / r.height)
    };
  };
  canvas.addEventListener('pointerdown', (e) => { touch = toCanvas(e); });
  canvas.addEventListener('pointermove', (e) => { if (touch) touch = toCanvas(e); });
  addEventListener('pointerup', () => { touch = null; });
  addEventListener('pointercancel', () => { touch = null; });

  /* ---------- 走动范围：不许穿水、穿树 ---------- */
  const blocked = (px, py) => {
    const cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return true;
    const t = MAP[cy][cx];
    return t === 2 || t === 4 || t === 3;
  };
  const canStand = (px, py) => {
    const r = 14;
    return !blocked(px - r, py + r) && !blocked(px + r, py + r)
        && !blocked(px - r, py - r) && !blocked(px + r, py - r);
  };

  /* ---------- 绘制 ---------- */
  function drawMap(time) {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = MAP[y][x];
        const px = x * TILE, py = y * TILE;
        if (t === 0) {
          ctx.fillStyle = (x + y) % 2 ? PALETTE.grass : PALETTE.grassAlt;
          ctx.fillRect(px, py, TILE, TILE);
          // 零星草点
          if ((x * 7 + y * 13) % 5 === 0) {
            ctx.fillStyle = 'rgba(255,255,255,.10)';
            ctx.fillRect(px + 8, py + 12, 3, 3);
            ctx.fillRect(px + 26, py + 28, 3, 3);
          }
        } else if (t === 1) {
          ctx.fillStyle = (x + y) % 2 ? PALETTE.path : PALETTE.pathAlt;
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,.045)';
          ctx.fillRect(px + 4, py + 34, TILE - 8, 2);
        } else if (t === 2) {
          ctx.fillStyle = (x + y) % 2 ? PALETTE.water : PALETTE.waterAlt;
          ctx.fillRect(px, py, TILE, TILE);
          const wob = Math.sin(time / 620 + x + y) * 3;
          ctx.fillStyle = 'rgba(255,255,255,.22)';
          ctx.fillRect(px + 8, py + 16 + wob, 14, 2);
          ctx.fillRect(px + 20, py + 27 - wob, 10, 2);
        } else if (t === 3) {
          ctx.fillStyle = PALETTE.grass;
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = PALETTE.soil;
          ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
          for (let i = 0; i < 3; i++) {
            ctx.fillStyle = PALETTE.flower[i];
            ctx.fillRect(px + 9 + i * 10, py + 14 + (i % 2) * 8, 5, 5);
          }
        } else if (t === 4) {
          ctx.fillStyle = PALETTE.grass;
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = PALETTE.trunk;
          ctx.fillRect(px + 17, py + 24, 7, 14);
          ctx.fillStyle = PALETTE.treeDark;
          ctx.beginPath();
          ctx.arc(px + 20, py + 20, 16, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = PALETTE.tree;
          ctx.beginPath();
          ctx.arc(px + 20, py + 17, 12, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  function drawShadow(x, y) {
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x, y + SPRITE * 0.42, SPRITE * 0.30, SPRITE * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSprite(img, x, y, bob, flip) {
    if (!img.complete || !img.naturalWidth) return;
    const half = SPRITE / 2;
    ctx.save();
    ctx.translate(x, y - half * 0.82 + bob);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -half, 0, SPRITE, SPRITE);
    ctx.restore();
  }

  /* ---------- 对话 ---------- */
  const bubble = document.getElementById('bubble');
  document.getElementById('bub-avatar').src = NPC_DATA;
  const bubText = document.getElementById('bub-text');
  const bubName = document.getElementById('bub-name');
  const bubTag  = document.getElementById('bub-tag');

  const LINES = null; // 已弃用，改用下面的 SCRIPT

  /* ===== 交互流程状态机：IDLE → MEET → TALK → REPORT → DONE ===== */
  const PHASE = { IDLE:'idle', MEET:'meet', TALK:'talk', REPORT:'report', DONE:'done' };
  let phase = PHASE.IDLE;
  let meetAt = 0;          // 用于「碰」的光环动画
  let lineIdx = 0;

  const MEET_MS = 900;      // 「碰」的闪光时长
  const LINE_MS = 2500;     // 每句停留

  // 两个孩子替主人聊的内容。第三轮才是这个产品的重点。
  // 运行时会被真实 agent 生成的内容覆盖，详见 fetchConversation()
  const SCRIPT = [
    { who:'A', text:'你好，我是小黄。' },
    { who:'B', text:'我是阿紫。你主人在学什么？' },
    { who:'A', text:'C++ 实时编程，还有 ROS 2。他说 Executor 一直没搞懂。' },
    { who:'B', text:'我家那位在调 PID，昨天熬到三点。' },
    { who:'A', text:'他们好像都需要早点睡。' },
    { who:'B', text:'那……要不要让他们认识一下？' }
  ];

  /* ---------- 接真实 agent ---------- */
  /* 只在本机跑服务时才尝试连。公网 https 页面去 fetch http://127.0.0.1:8001
     会被浏览器按混合内容直接拒掉，控制台一片红，体验上没有任何好处。 */
  const AGENT_URL = 'http://127.0.0.1:8001';
  const IS_LOCAL = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname)
    || location.protocol === 'file:';
  let LINES_RUNTIME = SCRIPT.slice();   // 当前要播的剧本
  let agentOnline = false;              // 是否真正接上了模型
  let prefetching = null;

  function setBadge(on) {
    agentOnline = on;
    const badge = document.getElementById('agent-badge');
    if (!badge) return;
    badge.textContent = on ? '已接入真实 agent' : '演示模式 · 内置台词';
    badge.className = 'agent-badge ' + (on ? 'on' : 'off');
  }

  async function fetchConversation() {
    // 公网打开时不去碰本地后端，直接用内置台词，保证一点就开
    if (!IS_LOCAL) { setBadge(false); return; }
    // 超时保护：网络或模型慢的时候不能让演示卡住
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 9000);
    try {
      const r = await fetch(`${AGENT_URL}/conversation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turns: 6 }),
        signal: ctrl.signal
      });
      const j = await r.json();
      if (Array.isArray(j.lines) && j.lines.length >= 4) {
        LINES_RUNTIME = j.lines;
        agentOnline = !j.fallback;
      }
    } catch (e) {
      agentOnline = false;
    } finally {
      clearTimeout(timer);
    }
    // 显示当前状态，让人看得见是真接了还是兜底
    setBadge(agentOnline);
  }

  // 预取：每次靠近前就准备好，靠近时零等待
  function prefetch() {
    if (prefetching) return prefetching;
    prefetching = fetchConversation().finally(() => { prefetching = null; });
    return prefetching;
  }

  const REPORT = {

    bubText.textContent = l.text;
    bubName.textContent = l.who === 'A' ? '小黄（你的）' : '阿紫（对方的）';
    document.getElementById('bub-avatar').src = l.who === 'A' ? HERO_DATA : NPC_DATA;
    bubTag.textContent = `${i + 1} / ${LINES_RUNTIME.length}`;
    bubble.classList.add('show');
  }

  function startMeet() {
    if (phase !== PHASE.IDLE) return;
    autoDemo = false;                  // 已经走到了，把方向盘还给用户
    touch = null;                      // 顺手松开虚拟手指，不然会继续往里拱
    phase = PHASE.MEET;
    meetAt = performance.now();
    hud.classList.add('hide');
    prefetch();                        // 顺便刷新下一段剧本
    setTimeout(startTalk, MEET_MS);
  }

  function startTalk() {
    if (phase !== PHASE.MEET) return;
    phase = PHASE.TALK;
    lineIdx = 0;
    showLine(0);
    let i = 1;
    const step = () => {
      if (phase !== PHASE.TALK) return;
      if (i < LINES_RUNTIME.length) { showLine(i); i += 1; setTimeout(step, LINE_MS); }
      else setTimeout(startReport, LINE_MS);
    };
    setTimeout(step, LINE_MS);
  }

  function startReport() {
    phase = PHASE.REPORT;
    bubble.classList.remove('show');
    document.getElementById('rp-avatar').src = NPC_DATA;
    document.getElementById('rp-score').textContent = REPORT.score;
    document.getElementById('rp-same').innerHTML =
      REPORT.same.map(t => `<span class="tag">${t}</span>`).join('');
    document.getElementById('rp-risk').innerHTML =
      REPORT.risk.map(t => `<span class="tag warn">${t}</span>`).join('');
    document.getElementById('rp-open').textContent = REPORT.open;
    reportEl.classList.add('show');
  }

  function closeReport() {
    reportEl.classList.remove('show');
    phase = PHASE.DONE;
    bubble.classList.remove('show');
    hud.classList.remove('hide');
  }

  document.getElementById('rp-skip').onclick = closeReport;
  document.getElementById('rp-go').onclick = () => {
    document.getElementById('rp-open').textContent = '（你走过去，发出了这条消息）';
    setTimeout(closeReport, 1200);
  };

  function resetMeeting() {
    phase = PHASE.IDLE;
    bubble.classList.remove('show');
    hud.classList.remove('hide');
  }

  /* ---------- 主循环 ---------- */
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function tick(time) {
    // 移动
    let mx = 0, my = 0;
    if (keys.left) mx -= 1;
    if (keys.right) mx += 1;
    if (keys.up) my -= 1;
    if (keys.down) my += 1;

    if (autoDemo) touch = { x: npc.x, y: npc.y };  // 一键演示：把目标钉在对方身上
    if (touch) {
      const dx = touch.x - hero.x, dy = touch.y - hero.y;
      if (Math.hypot(dx, dy) > 12) { mx = dx; my = dy; }
    }

    if (mx || my) {
      const len = Math.hypot(mx, my) || 1;
      const nx = hero.x + (mx / len) * hero.speed;
      const ny = hero.y + (my / len) * hero.speed;
      if (canStand(nx, hero.y)) hero.x = nx;
      if (canStand(hero.x, ny)) hero.y = ny;
      if (mx > 0.2) hero.dir = 1;
      if (mx < -0.2) hero.dir = -1;
      hero.bob = Math.sin(time / 110) * 2.2;
    } else {
      hero.bob *= 0.86;
    }

    hero.x = Math.max(TILE, Math.min(W - TILE, hero.x));
    hero.y = Math.max(TILE, Math.min(H - TILE, hero.y));

    // 场景
    drawMap(time);

    // 谁靠前谁后画
    const order = hero.y <= npc.y ? [npc, hero] : [hero, npc];
    for (const s of order) {
      drawShadow(s.x, s.y);
    }
    npc.bob = Math.sin(time / 480 + 1.6) * 3.5;
    if (hero.y <= npc.y) {
      drawSprite(npc.img, npc.x, npc.y, npc.bob, npc.x > hero.x);
      drawSprite(hero.img, hero.x, hero.y, hero.bob, hero.dir < 0);
    } else {
      drawSprite(hero.img, hero.x, hero.y, hero.bob, hero.dir < 0);
      drawSprite(npc.img, npc.x, npc.y, npc.bob, npc.x > hero.x);
    }

    // ---- 流程推进 ----
    const d = dist(hero, npc);

    if (phase === PHASE.IDLE && d < TALK_RANGE) {
      startMeet();
    }

    // 「碰」的扩散光环
    if (phase === PHASE.MEET) {
      const p = Math.min(1, (performance.now() - meetAt) / MEET_MS);
      const cx = (hero.x + npc.x) / 2, cy = (hero.y + npc.y) / 2 - 24;
      ctx.save();
      ctx.strokeStyle = `rgba(240,192,64,${(1 - p) * 0.9})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, 12 + p * 52, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${(1 - p) * 0.6})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, 6 + p * 34, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // 走远就重置，方便反复演示
    if (phase === PHASE.DONE && d > TALK_RANGE + 40) {
      resetMeeting();
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  /* ---------- 首屏两个入口 ---------- */
  const introEl = document.getElementById('intro');
  document.getElementById('btn-walk').onclick = () => {
    introEl.classList.add('hide');
  };
  document.getElementById('btn-auto').onclick = () => {
    introEl.classList.add('hide');
    autoDemo = true;
  };
  // 链接上加 ?auto=1 就跳过首屏直接演示，方便往材料/二维码里挂
  if (new URLSearchParams(location.search).get('auto') === '1') {
    introEl.classList.add('hide');
    autoDemo = true;
  }

  // 页面一加载就试一下能不能连上 agent，连不上就安心用内置台词
  prefetch();
})();
</script>
</body>
</html>
